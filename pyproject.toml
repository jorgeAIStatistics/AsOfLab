[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "asoflab"
version = "0.1.0"
description = "Local-first temporal replay and evaluation workbench: what could a prediction pipeline know at time T?"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Jorge Rodriguez" }]
keywords = ["point-in-time", "bitemporal", "data-leakage", "replay", "clinical-prediction", "evaluation"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering",
]
# Lower bounds are the minor series this project is actually tested against
# (see uv.lock). Older releases may work but are unverified.
dependencies = [
  "duckdb>=1.5,<2",
  "pyarrow>=26",
  "pydantic>=2.14,<3",
  "typer>=0.27",
  "numpy>=2.5,<3",
  "scipy>=1.18",
  "scikit-learn>=1.9",
  "psutil>=7.2",
]

[project.optional-dependencies]
serve = ["fastapi>=0.143", "uvicorn>=0.54"]

[project.scripts]
asoflab = "asoflab.cli:app"

[dependency-groups]
dev = [
  "pytest>=9.1",
  "hypothesis>=6.169",
  "ruff>=0.17",
  "mypy>=2.4",
  "httpx2>=2.13",
]

[tool.hatch.build.targets.wheel]
packages = ["src/asoflab"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "benchmarks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "C4", "PT"]
ignore = [
  "E501",   # line length is handled by the formatter
  "RUF001", # the docs and messages use real en dashes and multiplication signs
  "RUF002",
  "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-ra --strict-markers"
markers = [
  "slow: longer-running tests (simulation, statistics, subprocess crash tests)",
]

[tool.mypy]
python_version = "3.12"
files = ["src/asoflab"]
plugins = ["pydantic.mypy"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = false

[[tool.mypy.overrides]]
module = ["duckdb.*", "pyarrow.*", "sklearn.*", "scipy.*", "psutil.*"]
ignore_missing_imports = true
follow_imports = "skip"
